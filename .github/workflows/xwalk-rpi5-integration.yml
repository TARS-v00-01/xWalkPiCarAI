name: xWalkPiCarAI integration

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: [self-hosted, linux, x64, xwalk-ci]
    steps:
      - uses: actions/checkout@v6
      - name: Check out exact submitted component commits
        uses: ./.github/actions/checkout-private-submodules
      - name: Validate integration metadata
        run: xWalk-rpi5-tool/shell-agent/gerrit-tool/validate-integration-metadata.sh

  private-integration:
    runs-on: [self-hosted, linux, x64, xwalk-ci]
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v6
      - name: Check out exact submitted component commits
        uses: ./.github/actions/checkout-private-submodules
      - name: Validate host dependencies
        run: xWalk-rpi5-tool/shell-agent/quality-tool/check-host-quality-dependencies.sh
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then echo "CC=clang" >> "$GITHUB_ENV"; echo "CXX=clang++" >> "$GITHUB_ENV"; else echo "CC=gcc" >> "$GITHUB_ENV"; echo "CXX=g++" >> "$GITHUB_ENV"; fi
      - name: Configure complete integration
        run: cmake --fresh -S xWalk-rpi5-hw -B build-host/integration -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON -DXWALK_BUILD_RPI=OFF -DXWALK_ENABLE_STRICT_WARNINGS=ON
      - name: Build complete integration
        run: cmake --build build-host/integration --parallel
      - name: Test complete integration
        run: ctest --test-dir build-host/integration --output-on-failure --no-tests=error
  sanitizers:
    runs-on: [self-hosted, linux, x64, xwalk-ci]
    steps:
      - uses: actions/checkout@v6
      - name: Check out exact submitted component commits
        uses: ./.github/actions/checkout-private-submodules
      - name: Validate sanitizer dependencies
        run: xWalk-rpi5-tool/shell-agent/quality-tool/check-host-quality-dependencies.sh
      - name: Configure ASan and UBSan
        run: CC=clang CXX=clang++ cmake --fresh -S xWalk-rpi5-hw -B build-host/sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DXWALK_BUILD_RPI=OFF -DXWALK_ENABLE_SANITIZERS=ON -DXWALK_ENABLE_STRICT_WARNINGS=ON
      - name: Build and test ASan and UBSan
        run: cmake --build build-host/sanitizers --parallel && ctest --test-dir build-host/sanitizers --output-on-failure --no-tests=error
