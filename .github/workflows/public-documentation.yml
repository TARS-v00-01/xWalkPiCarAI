name: xWalk Public Documentation

on:
  push:
    branches: [master]
    paths:
      - docs/public/**
      - .github/workflows/public-documentation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xwalk-public-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'TARS-v00-01/xWalkPiCarAI' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # master is advanced only by the exact submitted Gerrit integration sync.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout: docs/public
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install public documentation dependencies
        run: python -m pip install --disable-pip-version-check -r docs/public/requirements.txt
      - name: Verify public source boundary
        run: python docs/public/verify.py
      - name: Build only the reviewed public chapters
        env:
          NO_MKDOCS_2_WARNING: 'true'
        run: python -m mkdocs build --strict --config-file docs/public/mkdocs.yml
      - name: Inspect rendered pages and search index
        run: python docs/public/verify.py build-public-docs/site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build-public-docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
